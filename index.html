<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Counter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e9f5e9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 350px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 8px;
      font-size: 16px;
    }
    p {
      margin-top: 5px;
      font-size: 14px;
      color: gray;
    }
    .warning {
      color: red;
    }
  </style>
</head>
<body>

  <div class="box">
    <h3>Type your message</h3>
    <textarea id="textArea" maxlength="200" placeholder="Write something..."></textarea>
    <p id="counter">0 / 200 characters</p>
    <p id="warning" class="warning"></p>
  </div>

 <script src="script.js"></script>

 

</body>
</html>
